name: marriage_hall_app
description: "Hall & Feast - Marriage Hall Booking App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^17.3.0

  # Fonts
  google_fonts: ^6.3.0

  # Date & Currency Formatting
  intl: ^0.20.3
  panorama_viewer: ^2.0.7
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/